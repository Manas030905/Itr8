name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: itr8
          POSTGRES_PASSWORD: itr8_dev
          POSTGRES_DB: itr8_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itr8 -d itr8_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://itr8:itr8_dev@localhost:5432/itr8_test
      TEST_DATABASE_URL: postgresql+psycopg://itr8:itr8_dev@localhost:5432/itr8_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Models and migrations agree (no drift)
        run: uv run alembic check
      - name: Committed OpenAPI schema is up to date
        run: |
          uv run python ../../scripts/export_openapi.py
          git diff --exit-code openapi.json

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          npm run generate:api
          git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          API_INTERNAL_URL: http://localhost:8000

  compose:
    name: Docker Compose stack (build, run, smoke test)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (fresh clone, no .env)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Wait for the web app
        run: |
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 2; done
          echo "web did not become ready"; exit 1
      - name: API tests inside the container
        run: docker compose exec -T api uv run --no-sync pytest -q
      - name: End-to-end smoke test through the web proxy
        run: |
          python -m pip install httpx
          python scripts/smoke_test.py http://localhost:3000
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
